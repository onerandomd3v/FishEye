[project]
name = "fisheye-evaluation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fisheye-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fisheye_evaluation"]

[tool.uv.sources]
fisheye-domain = { workspace = true }
