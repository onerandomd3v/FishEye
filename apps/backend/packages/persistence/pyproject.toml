[project]
name = "fisheye-persistence"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cryptography>=46,<47", "sqlalchemy>=2.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fisheye_persistence"]
