[project]
name = "fisheye-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fisheye-domain",
  "fisheye-persistence",
  "polars>=1.30,<2",
]

[project.scripts]
fisheye-worker = "fisheye_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fisheye_worker"]

[tool.uv.sources]
fisheye-domain = { workspace = true }
fisheye-persistence = { workspace = true }
