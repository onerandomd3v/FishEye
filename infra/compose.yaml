name: fisheye
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fisheye
      POSTGRES_USER: fisheye
      POSTGRES_PASSWORD: fisheye_dev_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - fisheye_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fisheye -d fisheye']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ['application']
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    command:
      - uv
      - run
      - --locked
      - --package
      - fisheye-api
      - alembic
      - -c
      - apps/backend/api/alembic.ini
      - upgrade
      - head
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://fisheye:fisheye_dev_only@postgres:5432/fisheye
      FISHEYE_ENV: development
      FISHEYE_SYNTHETIC_ONLY: 'true'
      FISHEYE_ENABLE_DEV_CSV_VALIDATION: ${FISHEYE_ENABLE_DEV_CSV_VALIDATION:-0}
      FISHEYE_ENABLE_DEV_CSV_IMPORT: ${FISHEYE_ENABLE_DEV_CSV_IMPORT:-0}
      FISHEYE_ENABLE_DEV_DATASET_READS: ${FISHEYE_ENABLE_DEV_DATASET_READS:-0}
      FISHEYE_ENABLE_DEV_EVALUATION_RUNS: ${FISHEYE_ENABLE_DEV_EVALUATION_RUNS:-0}
      FISHEYE_ARTIFACT_DIR: /var/lib/fisheye/artifacts
      FISHEYE_ARTIFACT_ENCRYPTION_KEY: ${FISHEYE_ARTIFACT_ENCRYPTION_KEY:?Set FISHEYE_ARTIFACT_ENCRYPTION_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    profiles: ['application']
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    command:
      - uv
      - run
      - --locked
      - --package
      - fisheye-api
      - uvicorn
      - fisheye_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
    environment: *backend_environment
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - fisheye_artifacts:/var/lib/fisheye/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    profiles: ['application']
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    command:
      - uv
      - run
      - --locked
      - --package
      - fisheye-worker
      - fisheye-worker
      - work
    environment: *backend_environment
    volumes:
      - fisheye_artifacts:/var/lib/fisheye/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  fisheye_pg:
  fisheye_artifacts:
