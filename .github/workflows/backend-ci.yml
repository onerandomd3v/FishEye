name: Backend CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend-checks:
    name: backend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Install Python workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Ruff lint
        run: uv run --locked ruff check apps/backend
      - name: Ruff format verification
        run: uv run --locked ruff format --check apps/backend
      - name: Static type checks
        run: uv run --locked mypy apps/backend/api/src apps/backend/worker/src apps/backend/packages/domain/src apps/backend/packages/evaluation/src apps/backend/packages/persistence/src
      - name: Backend tests
        run: uv run --locked pytest -q apps/backend/api/tests apps/backend/worker/tests -m 'not integration'
      - name: Worker import and startup checks
        run: |
          uv run --locked python -c 'import fisheye_api.main, fisheye_worker.main'
          uv run --locked --package fisheye-worker fisheye-worker
