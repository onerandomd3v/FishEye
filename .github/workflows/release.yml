name: Release gate
on:
  workflow_dispatch:
    inputs:
      target:
        description: Intended release target (does not deploy)
        required: true
        type: choice
        options: [staging, production]
permissions:
  contents: read
jobs:
  release-readiness:
    name: release-readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report release state
        run: |
          echo 'Builds and required checks are validated separately by pull request CI.'
          echo 'No release approval or deployment was performed for ${{ inputs.target }}.'
          echo 'Hosting and protected deployment environments have not been selected or configured.'
