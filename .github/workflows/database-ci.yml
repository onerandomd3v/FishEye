name: Database CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  database-checks:
    name: database-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fisheye_test
          POSTGRES_USER: fisheye
          POSTGRES_PASSWORD: fisheye_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fisheye -d fisheye_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.13.4
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Install Python workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Apply migration and verify rollback
        env:
          FISHEYE_TEST_DATABASE_URL: postgresql+psycopg://fisheye:fisheye_ci_only@localhost:5432/fisheye_test
        run: uv run --locked pytest -q -m integration apps/backend/api/tests
