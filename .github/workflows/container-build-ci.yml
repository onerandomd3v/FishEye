name: Container Build CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose-checks:
    name: compose-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate full local stack configuration
        run: FISHEYE_ARTIFACT_ENCRYPTION_KEY=compose-test-key FISHEYE_SESSION_SECRET=compose-test-secret FISHEYE_DEMO_EMAIL=analyst@example.test FISHEYE_DEMO_PASSWORD=compose-test-password docker compose -f infra/compose.yaml --profile application --profile web config --quiet
  container-build-checks:
    name: container-build-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - infra/docker/backend.Dockerfile
          - infra/docker/console.Dockerfile
          - infra/docker/landing.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build container image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "fisheye-ci:${{ strategy.job-index }}" .
