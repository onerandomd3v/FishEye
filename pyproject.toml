[project]
name = "fisheye-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "pytest>=9.0.3,<10",
  "ruff>=0.13.2,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/backend/api", "apps/backend/worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/backend/api/src", "apps/backend/worker/src"]

[tool.pytest.ini_options]
testpaths = ["apps/backend/api/tests", "apps/backend/worker/tests"]
markers = ["integration: requires an isolated PostgreSQL database"]
